<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCF Job Search — オーストラリア求人情報</title>
<meta name="description" content="Women Can Fly が集めた、オーストラリア・ワーホリ/留学生向けの求人情報。週ごとに更新。">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #1c1e21;
    --sub: #65676b;
    --brand: #1877f2;
    --border: #e4e6eb;
  }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, #1877f2, #0d5bc4);
    color: white;
    padding: 36px 20px 28px;
    text-align: center;
  }
  header h1 { font-size: 24px; margin-bottom: 6px; }
  header p { font-size: 13px; opacity: 0.9; }
  .search-bar {
    max-width: 480px;
    margin: 20px auto 0;
  }
  .search-bar input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 24px;
    border: none;
    font-size: 14px;
    outline: none;
  }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }

  .week-tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .week-tab {
    padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--card); font-size: 13px; font-weight: 600; cursor: pointer;
    color: var(--sub); transition: all 0.15s;
  }
  .week-tab.active { background: var(--brand); color: white; border-color: var(--brand); }
  .week-tab:hover:not(.active) { border-color: var(--brand); color: var(--brand); }

  .week-panel { display: none; }
  .week-panel.active { display: block; }

  .city-tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center; margin-bottom: 20px;
  }
  .city-tab {
    padding: 7px 16px; border: none; border-radius: 20px;
    font-size: 13px; cursor: pointer; font-weight: 600;
    opacity: 0.5; transition: opacity 0.15s;
  }
  .city-tab.active { opacity: 1; }
  .city-tab:hover { opacity: 0.85; }
  .c-sydney    { background: #d0e8ff; color: #1877f2; }
  .c-melbourne { background: #ffe4c0; color: #e67e00; }
  .c-brisbane  { background: #fff3b0; color: #b08000; }
  .c-perth     { background: #d0f5d0; color: #2e7d32; }
  .c-other     { background: #e8e8e8; color: #444; }

  .city-panel { display: none; }
  .city-panel.active { display: block; }

  .job-card {
    background: var(--card); border-radius: 12px; padding: 20px;
    margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .job-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .job-company { font-size: 13.5px; color: var(--sub); margin-bottom: 12px; }
  .job-meta { font-size: 13px; color: var(--sub); margin-bottom: 4px; line-height: 1.6; }
  .job-meta b { color: var(--text); font-weight: 600; }
  .job-req { margin: 8px 0; padding-left: 18px; }
  .job-req li { font-size: 13px; color: var(--sub); margin-bottom: 2px; }
  .job-desc { font-size: 13.5px; margin: 10px 0; line-height: 1.7; }
  .job-wage {
    display: inline-block; background: #e6f4ea; color: #2e7d32;
    font-size: 14px; font-weight: 700; padding: 5px 12px; border-radius: 8px;
    margin: 6px 0 12px;
  }
  .job-apply {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--brand); color: white; text-decoration: none;
    font-size: 13px; font-weight: 600; padding: 9px 18px; border-radius: 8px;
    transition: background 0.15s;
  }
  .job-apply:hover { background: #145dbf; }
  .job-source { font-size: 11px; color: #999; margin-left: 10px; }

  .no-result { text-align: center; color: var(--sub); padding: 40px 0; font-size: 14px; }

  footer {
    text-align: center; color: var(--sub); font-size: 12px;
    padding: 30px 20px 50px; line-height: 1.8;
  }

  @media (prefers-color-scheme: dark) {
    :root { --bg:#18191a; --card:#242526; --text:#e4e6eb; --sub:#b0b3b8; --border:#3a3b3c; }
    .search-bar input { background: #3a3b3c; color: #e4e6eb; }
    .week-tab { background: var(--card); }
    .job-wage { background: #1c3a2a; color: #6fd393; }
  }
</style>
</head>
<body>

<header>
  <h1>🔎 WCF Job Search</h1>
  <p>Women Can Fly が集めた、オーストラリア・ワーホリ／留学生向けの求人情報</p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="会社名・職種・地域で検索…">
  </div>
</header>

<main>
  <div class="week-tabs" id="weekTabs"></div>
  <div id="weekPanels"></div>
  <div class="no-result" id="noResult" style="display:none;">該当する求人が見つかりませんでした。</div>
</main>

<footer>
  少しでも皆さんのお仕事が見つかりやすくなるよう、一般の掲示板などで見つけた求人を掲載しています。<br>
  こちらで記載する情報は自己責任でご応募ください。お仕事内容・面接の合否には責任は持てません。<br>
  URL・賃金・勤務地は掲載時点で実在確認済みです。<br><br>
  © Women Can Fly
</footer>

<script src="data.js"></script>
<script>
const CITY_KEYS = ["sydney", "melbourne", "brisbane", "perth", "other"];

function buildSite() {
  const weekTabs = document.getElementById('weekTabs');
  const weekPanels = document.getElementById('weekPanels');

  JOB_WEEKS.forEach((week, wi) => {
    // week tab
    const tab = document.createElement('button');
    tab.className = 'week-tab' + (wi === 0 ? ' active' : '');
    tab.textContent = week.label;
    tab.onclick = () => showWeek(wi);
    tab.id = 'week-tab-' + wi;
    weekTabs.appendChild(tab);

    // week panel
    const panel = document.createElement('div');
    panel.className = 'week-panel' + (wi === 0 ? ' active' : '');
    panel.id = 'week-panel-' + wi;

    const cityTabs = document.createElement('div');
    cityTabs.className = 'city-tabs';

    const cityPanelsWrap = document.createElement('div');

    CITY_KEYS.forEach((ck, ci) => {
      const city = week.cities[ck];
      if (!city) return;

      const ctab = document.createElement('button');
      ctab.className = 'city-tab c-' + ck + (ci === 0 ? ' active' : '');
      ctab.textContent = city.emoji + ' ' + city.name;
      ctab.onclick = () => showCity(wi, ck);
      ctab.id = 'city-tab-' + wi + '-' + ck;
      cityTabs.appendChild(ctab);

      const cpanel = document.createElement('div');
      cpanel.className = 'city-panel' + (ci === 0 ? ' active' : '');
      cpanel.id = 'city-panel-' + wi + '-' + ck;

      city.jobs.forEach(job => {
        cpanel.appendChild(renderJobCard(job, week.label, city.name));
      });

      cityPanelsWrap.appendChild(cpanel);
    });

    panel.appendChild(cityTabs);
    panel.appendChild(cityPanelsWrap);
    weekPanels.appendChild(panel);
  });
}

function renderJobCard(job, weekLabel, cityName) {
  const card = document.createElement('div');
  card.className = 'job-card';
  card.dataset.search = [job.title, job.company, job.location, cityName].join(' ').toLowerCase();

  const reqHtml = job.requirements.map(r => `<li>${escapeHtml(r)}</li>`).join('');

  card.innerHTML = `
    <div class="job-title">${escapeHtml(job.title)}</div>
    <div class="job-company">${escapeHtml(job.company)}</div>
    <div class="job-meta">📍 <b>勤務地:</b> ${escapeHtml(job.location)}</div>
    <div class="job-meta">🗓 <b>勤務日数:</b> ${escapeHtml(job.schedule)}</div>
    <ul class="job-req">${reqHtml}</ul>
    <div class="job-desc">${escapeHtml(job.description)}</div>
    <div class="job-wage">💰 ${escapeHtml(job.wage)}</div><br>
    <a class="job-apply" href="${job.url}" target="_blank" rel="noopener">求人ページを見る →</a>
    <span class="job-source">via ${escapeHtml(job.source)}</span>
  `;
  return card;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showWeek(wi) {
  document.querySelectorAll('.week-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.week-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('week-panel-' + wi).classList.add('active');
  document.getElementById('week-tab-' + wi).classList.add('active');
  applySearch();
}

function showCity(wi, ck) {
  const panel = document.getElementById('week-panel-' + wi);
  panel.querySelectorAll('.city-panel').forEach(p => p.classList.remove('active'));
  panel.querySelectorAll('.city-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('city-panel-' + wi + '-' + ck).classList.add('active');
  document.getElementById('city-tab-' + wi + '-' + ck).classList.add('active');
}

function applySearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let anyVisibleInActiveWeek = false;
  const activeWeekPanel = document.querySelector('.week-panel.active');

  document.querySelectorAll('.job-card').forEach(card => {
    const match = !q || card.dataset.search.includes(q);
    card.style.display = match ? '' : 'none';
    if (match && activeWeekPanel && activeWeekPanel.contains(card)) anyVisibleInActiveWeek = true;
  });

  document.getElementById('noResult').style.display = (q && !anyVisibleInActiveWeek) ? 'block' : 'none';
}

document.getElementById('searchInput').addEventListener('input', applySearch);
buildSite();
</script>
</body>
</html>
